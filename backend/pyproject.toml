[project]
name = "backend"
version = "0.1.0"
description = "FastAPI hybrid fashion catalog RAG service"
readme = "README.md"
authors = [
    { name = "rahulintegrationasp-intern", email = "rahul.integrationasp@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.162.0",
    "chromadb>=1.5.0",
    "langchain-chroma>=1.1.0",
    "langchain>=1.4.9",
    "langgraph>=1.2.20",
    "redis>=8.1.0",
    "httpx>=0.28.1",
    "pydantic>=2.0.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
